<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NG — 200 Popular Topics</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #0d131d;
      --border: #253247;
      --text: #f3f6fb;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --ok: #34d399;
      --warn: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      transition: max-width 0.2s ease, padding 0.2s ease;
    }

    .app.expanded {
      max-width: 1240px;
      padding: 24px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .ng-logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(145deg, #1d4ed8, #0f172a);
      border: 1px solid rgba(96, 165, 250, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    .ng-logo svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lang-select {
      padding: 6px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .lang-select:focus {
      border-color: var(--accent);
    }

    .expand-btn,
    .reset-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .expand-btn:hover,
    .reset-btn:hover {
      border-color: var(--accent);
      color: #ffffff;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      color: #93c5fd;
      background: var(--accent-soft);
      border: 1px solid rgba(59, 130, 246, 0.32);
      padding: 5px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 640px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }

    .search-input,
    .cat-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus,
    .cat-select:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      color: #64748b;
    }

    .topics-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-height: 132px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 14px;
    }

    .topic-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .topic-btn:hover {
      border-color: #475569;
      color: var(--text);
    }

    .topic-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
    }

    .result-tag {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .box {
      background: var(--surface-2);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 22px 20px;
      min-height: 360px;
      max-height: 540px;
      overflow-y: auto;
      font-size: 18px;
      line-height: 1.7;
      letter-spacing: 0.15px;
      margin-bottom: 12px;
      user-select: text;
    }

    .app.expanded .box {
      max-height: 68vh;
      font-size: 20px;
    }

    .line-item {
      display: block;
      margin-bottom: 12px;
      font-weight: 500;
      transition: color 0.18s ease;
    }

    .line-item:last-child {
      margin-bottom: 0;
    }

    .sources-box {
      background: var(--surface-2);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .sources-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .sources-about {
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.28);
      color: #93c5fd;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
    }

    .source-link:hover {
      background: rgba(59, 130, 246, 0.22);
      color: #ffffff;
    }

    .copy-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    .copy-btn:hover {
      background: var(--accent-hover);
    }

    .copy-btn:active {
      transform: scale(0.99);
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
      text-align: center;
      color: var(--ok);
    }

    .status.warn {
      color: var(--warn);
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div id="appRoot" class="app">
    <div class="top-bar">
      <div class="brand">
        <div class="ng-logo" aria-label="NG logo">
          <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 27V9L14.5 27V9" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M30 13.2C28.8 10.6 26.2 9 23.2 9C19.1 9 16.5 12.2 16.5 18C16.5 23.8 19.1 27 23.2 27C27.2 27 29.8 24.4 29.8 20.4V18.4H23.5" stroke="#93C5FD" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div id="brandTitle" class="brand-title">NG · Straight to the Point</div>
          <div id="counterSub" class="brand-sub">Library: 200 topics · 200 individual sections</div>
        </div>
      </div>
      <div class="top-actions">
        <select id="langSelect" class="lang-select" aria-label="Interface and topic language" onchange="changeLanguage()">
          <option value="en" selected>EN · English</option>
          <option value="ru">RU · Русский</option>
          <option value="zh">ZH · 中文</option>
          <option value="hi">HI · हिन्दी</option>
          <option value="es">ES · Español</option>
          <option value="ar">AR · العربية</option>
        </select>
        <button id="expandBtn" class="expand-btn" type="button" onclick="toggleExpand()">Wider screen</button>
        <div class="badge">v1.5 · 200</div>
      </div>
    </div>

    <div class="controls">
      <input
        id="search"
        class="search-input"
        type="search"
        placeholder="Search across 200 topics & sections..."
        oninput="applyFilters()"
      />
      <select id="category" class="cat-select" onchange="applyFilters()">
        <option value="ALL">All 200 sections</option>
      </select>
      <button id="resetBtn" class="reset-btn" type="button" onclick="resetFilters()">Reset</button>
    </div>

    <div class="topics-meta">
      <span id="shownCount">Showing 200 of 200</span>
      <span id="shortcutHint">Shortcuts: / search · Alt+←/→ topic</span>
    </div>

    <div id="topics" class="topics"></div>

    <div class="result-head">
      <div id="resultTitle" class="result-title"></div>
      <div id="resultTag" class="result-tag"></div>
    </div>

    <div id="result" class="box"></div>

    <div id="sourcesBox" class="sources-box">
      <div id="sourcesTitle" class="sources-title">Where the topic comes from &amp; YouTube link</div>
      <div id="sourcesAbout" class="sources-about"></div>
      <div id="sourceLinks" class="source-links"></div>
    </div>

    <button id="copyBtn" class="copy-btn" onclick="copyText()">Copy summary</button>
    <div id="status" class="status"></div>
  </div>

    function getSeedTranslation(lang, idxZeroBased) {
      const list = SEED_TRANSLATIONS[lang] || SEED_TRANSLATIONS.en;
      return list[idxZeroBased % list.length];
    }

    function getLocalizedSectionName(num, titleText) {
      const m = LANG_META[currentLang] || LANG_META.en;
      return m.sectionLabel.replace("{n}", String(num)).replace("{title}", titleText);
    }

    function getLocalizedTopic(item) {
      if (!item) return null;
      const num = item.num;
      const idx = (num - 1) % TOPIC_SEEDS.length;
      const m = LANG_META[currentLang] || LANG_META.en;
      const tier = num <= 100 ? m.tierTop100 : m.tierNext100;

      let title = item.title;
      let btn = item.btn;
      let sourceText = TOPIC_SEEDS[idx].a;

      if (currentLang !== "ru") {
        const seedTr = getSeedTranslation(currentLang, idx);
        sourceText = seedTr.a;
        if (num <= 50) {
          title = `${seedTr.t} (${m.topicPrefix} #${num})`;
          btn = num === 1 && currentLang === "en" ? "AI & LLMs" : `${seedTr.k} · ${num}`;
        } else {
          title = `${seedTr.t} (#${num})`;
          btn = `${seedTr.k} · ${num}`;
        }
      }

      const sectionName = getLocalizedSectionName(num, title);
      const about = m.aboutTemplate
        .replace("{source}", sourceText)
        .replace("{n}", String(num))
        .replace("{tier}", tier);

      const text = [
        m.line1.replace("{n}", String(num)).replace("{title}", title),
        m.line2.replace("{source}", sourceText).replace("{tier}", tier).replace("{n}", String(num)),
        m.line3,
        m.line4,
        m.line5
      ].join("\n");

      return {
        ...item,
        btn,
        title,
        sectionName,
        text,
        about,
        extraLinks: Array.isArray(item.extraLinks) ? item.extraLinks : []
      };
    }

    function getSearchHaystack(item) {
      const loc = getLocalizedTopic(item);
      const ruSection = `раздел ${item.num} ${item.title}`;
      const enSection = `section ${item.num} ${loc.title}`;
      return [
        String(item.num || ""),
        item.id || "",
        item.btn || "",
        item.title || "",
        item.text || "",
        item.about || "",
        loc.btn || "",
        loc.title || "",
        loc.sectionName || "",
        loc.text || "",
        loc.about || "",
        ruSection,
        enSection
      ].join(" ").toLowerCase();
    }

    function tUI(key, vars = {}) {
      const pack = LANG_META[currentLang] || LANG_META.en;
      let str = pack[key] ?? LANG_META.en[key] ?? "";
      Object.entries(vars).forEach(([k, v]) => {
        str = str.replace(new RegExp(`\\{${k}\\}`, "g"), String(v));
      });
      return str;
    }

      const root = document.getElementById("appRoot");
      const btn = document.getElementById("expandBtn");
      root.classList.toggle("expanded", isExpanded);
      btn.textContent = isExpanded ? tUI("expandLess") : tUI("expandMore");

      const aboutEl = document.getElementById("sourcesAbout");
      const linksEl = document.getElementById("sourceLinks");
      aboutEl.textContent = locItem.about || "";
      linksEl.innerHTML = "";

      const baseQuery = locItem.title || locItem.btn || "";
      if (baseQuery) {
        const ytLink = document.createElement("a");
        ytLink.className = "source-link";
        ytLink.target = "_blank";
        ytLink.rel = "noopener noreferrer";
        ytLink.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(baseQuery + " " + tUI("ytSuffix"));
        ytLink.textContent = "▶ " + tUI("ytSearchLabel");
        linksEl.appendChild(ytLink);

        const webLink = document.createElement("a");
        webLink.className = "source-link";
        webLink.target = "_blank";
        webLink.rel = "noopener noreferrer";
        webLink.href = "https://www.google.com/search?q=" + encodeURIComponent(baseQuery + " " + tUI("webSuffix"));
        webLink.textContent = "↗ " + tUI("webSearchLabel");
        linksEl.appendChild(webLink);
      }
    }

    function renderResultBox(rawText) {
      const box = document.getElementById("result");
      box.innerHTML = "";
      const lines = (rawText || tUI("fallbackText")).split("\n");
      lines.forEach((line, idx) => {
        const span = document.createElement("span");
        span.className = "line-item";
        span.style.color = LINE_COLORS[idx % LINE_COLORS.length];
        span.textContent = line;
        box.appendChild(span);
      });
    }

    function populateCategories(preservedValue = "ALL") {
      const select = document.getElementById("category");
      select.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "ALL";
      allOpt.textContent = tUI("allCategories", { sections: SECTION_KEYS.length });
      select.appendChild(allOpt);

      data.forEach(item => {
        const loc = getLocalizedTopic(item);
        const opt = document.createElement("option");
        opt.value = item.tag;
        opt.textContent = loc.sectionName;
        select.appendChild(opt);
      });

      select.value = preservedValue;
      if (select.value !== preservedValue) {
        select.value = "ALL";
      }
    }

    function getFilteredData() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const sec = document.getElementById("category").value;

      return data.filter(item => {
        const matchesSec = sec === "ALL" || item.tag === sec;
        if (!matchesSec) return false;
        if (!q) return true;
        return getSearchHaystack(item).includes(q);
      });
    }

    function applyFilters() {
      const filtered = getFilteredData();
      const topicsEl = document.getElementById("topics");
      const shownCountEl = document.getElementById("shownCount");
      topicsEl.innerHTML = "";
      shownCountEl.textContent = tUI("shownCount", { shown: filtered.length, total: data.length });

      if (filtered.length === 0) {
        topicsEl.innerHTML = `<div class="empty">${tUI("emptyList")}</div>`;
        document.getElementById("resultTitle").textContent = "";
        document.getElementById("resultTag").textContent = "";
        document.getElementById("result").innerHTML = "";
        document.getElementById("sourcesAbout").textContent = "";
        document.getElementById("sourceLinks").innerHTML = "";
        return;
      }

      if (!filtered.some(item => item.id === selectedId)) {
        selectedId = filtered[0].id;
      }

      filtered.forEach(item => {
        const loc = getLocalizedTopic(item);
        const btn = document.createElement("button");
        btn.className = "topic-btn" + (item.id === selectedId ? " active" : "");
        btn.type = "button";
        btn.textContent = `${item.num}. ${loc.btn}`;
        btn.onclick = () => selectTopic(item.id);
        topicsEl.appendChild(btn);
      });

      const activeRaw = filtered.find(item => item.id === selectedId) || filtered[0];
      const loc = getLocalizedTopic(activeRaw);

      document.getElementById("resultTitle").textContent = `${activeRaw.num}. ${loc.title}`;
      document.getElementById("resultTag").textContent =
        `${tUI("topicPrefix")} ${activeRaw.num}/${data.length}`;
      renderResultBox(loc.text);
      buildSources(loc);
    }

    function resetFilters() {
      document.getElementById("search").value = "";
      document.getElementById("category").value = "ALL";
      setStatus("");
      applyFilters();
    }

    function selectTopic(id) {
      selectedId = id;
      setStatus("");
      applyFilters();
    }

    function stepTopic(delta) {
      const filtered = getFilteredData();
      if (filtered.length === 0) return;
      const curIdx = Math.max(0, filtered.findIndex(item => item.id === selectedId));
      const nextIdx = (curIdx + delta + filtered.length) % filtered.length;
      selectTopic(filtered[nextIdx].id);
    }

    function applyLanguageTexts() {
      const pack = LANG_META[currentLang] || LANG_META.en;
      document.documentElement.lang = currentLang;
      document.documentElement.dir = pack.dir || "ltr";
      document.getElementById("brandTitle").textContent = tUI("brandTitle");
      document.getElementById("counterSub").textContent = tUI("counterSub", {
        count: data.length,
        sections: SECTION_KEYS.length
      });
      document.getElementById("resetBtn").textContent = tUI("resetBtn");
      document.getElementById("shortcutHint").textContent = tUI("shortcutHint");
      document.getElementById("search").placeholder = tUI("searchPlaceholder", {
        count: data.length,
        sections: SECTION_KEYS.length
      });
      document.getElementById("sourcesTitle").textContent = tUI("sourcesTitle");
      document.getElementById("copyBtn").textContent = tUI("copyBtn");
      applyExpandState();
    }

    function changeLanguage() {
      currentLang = document.getElementById("langSelect").value;
      const currentSec = document.getElementById("category").value;
      applyLanguageTexts();
      populateCategories(currentSec);
      setStatus("");
      applyFilters();
    }

    function setStatus(msg, isWarn = false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isWarn ? "status warn" : "status";
    }

    async function copyText() {
      const rawItem = data.find(item => item.id === selectedId) || data[0];
      const loc = getLocalizedTopic(rawItem);
      const title = loc ? loc.title : "";
      const body = loc ? loc.text : "";
      const fullText = title ? `${title}\n\n${body}` : body;
      if (!fullText) return;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(fullText);
          setStatus(tUI("copiedOk"), false);
          return;
        }
      } catch (_) {}

      const box = document.getElementById("result");
      const range = document.createRange();
      range.selectNodeContents(box);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try {
        document.execCommand("copy");
        setStatus(tUI("copiedOk"), false);
      } catch (_) {
        setStatus(tUI("copiedWarn"), true);
      }
    }

    document.addEventListener("keydown", e => {
      const searchInput = document.getElementById("search");
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === "Escape" && document.activeElement === searchInput) {
        if (searchInput.value) {
          searchInput.value = "";
          applyFilters();
        } else {
          searchInput.blur();
        }
      } else if (e.altKey && e.key === "ArrowRight") {
        e.preventDefault();
        stepTopic(1);
      } else if (e.altKey && e.key === "ArrowLeft") {
        e.preventDefault();
        stepTopic(-1);
      }
    });

    applyLanguageTexts();
    populateCategories("ALL");
    applyFilters();
  </script>
  <script data-goatcounter="https://nikitang.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
